<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>Mapa de empleados - Rutas de transporte</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#1f2937;background:#f3f4f6;overflow:hidden}
header{background:#1f3864;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:15px;font-weight:600;flex:1;line-height:1.25}
#burger{display:none;background:rgba(255,255,255,.15);border:0;color:#fff;font-size:13px;padding:8px 12px;border-radius:6px}
#wrap{display:flex;height:calc(100% - 44px)}
#side{width:266px;background:#fff;border-right:1px solid #d1d5db;overflow:auto;padding:14px;flex:none}
#map{flex:1;height:100%}
h3{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#6b7280;margin:14px 0 6px}h3:first-child{margin-top:0}
label{display:flex;align-items:center;gap:9px;font-size:14px;padding:7px 0;cursor:pointer}
input[type=checkbox]{width:18px;height:18px}
select{width:100%;padding:9px;font-size:14px;border:1px solid #d1d5db;border-radius:6px;background:#fff}
.dot{width:13px;height:13px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.25)}
.cnt{margin-left:auto;font-size:12px;color:#6b7280}
.cro{width:100%;padding:8px;margin-top:5px;font-size:13px;border:1px solid #d1d5db;background:#fff;border-radius:6px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px}
.cro:hover{background:#eef2ff}
.pop b{font-size:14px}.pop div{font-size:13px;color:#4b5563;margin-top:3px}
.badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:9px;color:#fff;margin-top:6px}
.aprox{color:#b45309;font-size:12px;margin-top:4px}
#tot{font-size:24px;font-weight:600}
#modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.75);z-index:3000;padding:16px;overflow:auto}
#modal.on{display:block}
#mbox{background:#fff;border-radius:10px;max-width:1000px;margin:20px auto;padding:16px}
#mbox h2{margin:0 0 2px;font-size:16px;color:#1f3864}
#mbox p{margin:0 0 10px;font-size:13px;color:#6b7280}
#mbox img{width:100%;border:1px solid #e5e7eb;border-radius:6px}
#cerrar{float:right;border:0;background:#1f3864;color:#fff;padding:8px 14px;border-radius:6px;font-size:13px;cursor:pointer}
@media(max-width:760px){
 #burger{display:block}#wrap{display:block;position:relative}
 #map{height:100%;width:100%}
 #side{position:absolute;z-index:1000;top:0;left:0;right:0;width:auto;max-height:80%;
  border-right:0;border-bottom:1px solid #d1d5db;box-shadow:0 6px 20px rgba(0,0,0,.18);display:none}
 #side.on{display:block}header h1{font-size:14px}
}

var COL={'1':'#e24b4a','2':'#378add','3':'#639922','4':'#ba7517','5':'#7f77dd','SIN RUTA':'#888780'};
var map=L.map('map',{tap:true}).setView([10.94,-74.79],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
var cluster=L.markerClusterGroup({maxClusterRadius:34});map.addLayer(cluster);
var hulls=L.layerGroup().addTo(map);
var lineas=L.layerGroup().addTo(map);
DATA.forEach(function(d,i){var a=(i*137.5)*Math.PI/180,r=(d.prec==='MUNICIPIO'?.0075:.0011)+(i%5)*.0004;
 d.lat=d.lat+r*Math.cos(a); d.lon=d.lon+r*Math.sin(a);});
var rutas=[...new Set(DATA.map(d=>d.ruta))].sort(),cr=document.getElementById('rutas');
rutas.forEach(function(r){var n=DATA.filter(d=>d.ruta===r).length,l=document.createElement('label');
 l.innerHTML='<input type="checkbox" checked value="'+r+'"><span class="dot" style="background:'+(COL[r]||'#888')+'"></span>Ruta '+r+'<span class="cnt">'+n+'</span>';cr.appendChild(l);});
var cc=document.getElementById('croqs');
Object.keys(CROQ).sort().forEach(function(k){var b=document.createElement('button');
 b.className='cro';b.innerHTML='<span class="dot" style="background:'+COL[k]+'"></span>Ver croquis ruta '+k;
 b.onclick=function(){document.getElementById('mtit').textContent='Ruta '+k+' - '+CROQ[k].ini;
  document.getElementById('mnota').textContent=CROQ[k].nota+'. Esquema del rutograma, no esta a escala.';
  document.getElementById('mimg').src='data:image/png;base64,'+CROQ[k].b64;
  document.getElementById('modal').classList.add('on');};
 cc.appendChild(b);});
document.getElementById('cerrar').onclick=function(){document.getElementById('modal').classList.remove('on');};
document.getElementById('modal').onclick=function(e){if(e.target.id==='modal')this.classList.remove('on');};
[['turno','turno'],['modo','modo']].forEach(function(p){var s=document.getElementById(p[0]);
 [...new Set(DATA.map(d=>d[p[1]]).filter(Boolean))].sort().forEach(function(v){var o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o);});});
function hull(P){if(P.length<3)return P;
 P=P.slice().sort(function(a,b){return a[1]-b[1]||a[0]-b[0]});
 function cross(o,a,b){return (a[1]-o[1])*(b[0]-o[0])-(a[0]-o[0])*(b[1]-o[1]);}
 var lo=[],up=[];
 for(var i=0;i<P.length;i++){while(lo.length>=2&&cross(lo[lo.length-2],lo[lo.length-1],P[i])<=0)lo.pop();lo.push(P[i]);}
 for(var i=P.length-1;i>=0;i--){while(up.length>=2&&cross(up[up.length-2],up[up.length-1],P[i])<=0)up.pop();up.push(P[i]);}
 lo.pop();up.pop();return lo.concat(up);}
function draw(){cluster.clearLayers();hulls.clearLayers();lineas.clearLayers();
 var rs=[...document.querySelectorAll('#rutas input:checked')].map(i=>i.value),t=turno.value,m=modo.value,p=prec.value,n=0;
 var byr={};
 DATA.forEach(function(d){
  if(rs.indexOf(d.ruta)<0)return; if(t&&d.turno!==t)return; if(m&&d.modo!==m)return; if(p&&d.prec!==p)return;
  n++;var c=COL[d.ruta]||'#888780';
  (byr[d.ruta]=byr[d.ruta]||[]).push([d.lat,d.lon]);
  var mk=L.circleMarker([d.lat,d.lon],{radius:7,color:'#fff',weight:2,fillColor:c,fillOpacity:.9});
  mk.bindPopup('<div class="pop"><b>'+d.nom+'</b><div>'+d.dir+'</div><div>'+d.bar+' - '+d.mun+'</div>'+
   '<div>'+(d.turno||'sin programar')+(d.area?' - '+d.area:'')+'</div>'+
   '<span class="badge" style="background:'+c+'">Ruta '+d.ruta+'</span>'+
   (d.prec==='MUNICIPIO'?'<div class="aprox">Ubicacion aproximada sobre '+d.mun+'</div>':'')+'</div>');
  cluster.addLayer(mk);});
 if(document.getElementById('hull').checked){
  Object.keys(byr).forEach(function(r){var h=hull(byr[r]);if(h.length<3)return;
   L.polygon(h,{color:COL[r]||'#888',weight:2,fillOpacity:.08,dashArray:'6,5'})
    .bindPopup('Zona que cubre la ruta '+r+' segun donde vive su gente. No es el recorrido del bus.')
    .addTo(hulls);});}
 var rsel=[...document.querySelectorAll('#rutas input:checked')].map(i=>i.value);
 if(document.getElementById('traz').checked){
  Object.keys(TRAZ).forEach(function(k){ if(rsel.indexOf(k)<0)return;
   if(TRAZ[k].linea){
     L.polyline(TRAZ[k].linea,{color:'#fff',weight:8,opacity:.7}).addTo(lineas);
     L.polyline(TRAZ[k].linea,{color:COL[k],weight:4.5,opacity:.95})
      .bindPopup('<b>Recorrido ruta '+k+'</b><div>'+TRAZ[k].nombre+'</div><div>'+TRAZ[k].km+' km · '+TRAZ[k].min+' min</div>').addTo(lineas);}
   TRAZ[k].pts.forEach(function(p,ix){
    L.circleMarker([p[0],p[1]],{radius:5,color:COL[k],weight:2,fillColor:'#fff',fillOpacity:1})
     .bindPopup('<b>Ruta '+k+'</b><div>'+(ix+1)+'. '+p[2]+'</div>').addTo(lineas);});});}
 document.getElementById('tot').textContent=n;}
document.getElementById('side').addEventListener('change',draw);
document.getElementById('burger').onclick=function(){document.getElementById('side').classList.toggle('on');
 setTimeout(function(){map.invalidateSize()},50);};
map.on('click',function(){var s=document.getElementById('side');
 if(window.innerWidth<=760&&s.classList.contains('on'))s.classList.remove('on');});
draw();
